                                                        {(comparisonRoutes.results[comparisonRoutes.best_method].total_distance_km - allRoutes.results[allRoutes.best_method].total_distance_km) > 0 ? '+' : ''}
                                                        {(comparisonRoutes.results[comparisonRoutes.best_method].total_distance_km - allRoutes.results[allRoutes.best_method].total_distance_km).toFixed(2)} km
                                                    </span></div>
                                                    <div>Time Change: <span className={`font-bold ${
                                                        ((comparisonRoutes.results[comparisonRoutes.best_method].total_time_hours - allRoutes.results[allRoutes.best_method].total_time_hours) * 60) > 0 
                                                            ? 'text-red-600' : 'text-green-600'
                                                    }`}>
                                                        {((comparisonRoutes.results[comparisonRoutes.best_method].total_time_hours - allRoutes.results[allRoutes.best_method].total_time_hours) * 60) > 0 ? '+' : ''}
                                                        {((comparisonRoutes.results[comparisonRoutes.best_method].total_time_hours - allRoutes.results[allRoutes.best_method].total_time_hours) * 60).toFixed(0)} min
                                                    </span></div>
                                                </div>
                                            </div>

                                            <button
                                                onClick={() => {
                                                    setCurrentView('routes');
                                                    setComparisonRoutes(null);
                                                }}
                                                className="w-full bg-gray-600 text-white py-2 rounded-lg font-semibold hover:bg-gray-700 transition-all"
                                            >
                                                ↩️ Back to Routes
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* Main Content Area */}
                        <div className="flex-1 overflow-hidden">
                            {!selectedZone && (
                                <div className="flex items-center justify-center h-full bg-gradient-to-br from-gray-100 to-gray-200">
                                    <div className="text-center p-8 bg-white rounded-lg shadow-xl">
                                        <div className="text-6xl mb-4">🗺️</div>
                                        <p className="text-gray-600 text-xl font-semibold mb-2">Select a postal zone to begin</p>
                                        <p className="text-gray-400 text-sm">Choose from the dropdown menu on the left</p>
                                    </div>
                                </div>
                            )}

                            {selectedZone && currentView === 'upload' && (
                                <div className="flex items-center justify-center h-full bg-gradient-to-br from-blue-50 to-indigo-50">
                                    <div className="text-center p-8 bg-white rounded-lg shadow-xl max-w-md">
                                        <div className="text-6xl mb-4">📤</div>
                                        <p className="text-gray-700 text-xl font-semibold mb-2">Upload Your Mail Data</p>
                                        <p className="text-gray-500 text-sm mb-4">Upload a CSV file with mail delivery information to get started</p>
                                        <div className="text-xs text-gray-400 text-left bg-gray-50 p-3 rounded">
                                            <p className="font-semibold mb-1">Required CSV columns:</p>
                                            <ul className="list-disc list-inside space-y-1">
                                                <li>address</li>
                                                <li>mail_type</li>
                                                <li>latitude (optional)</li>
                                                <li>longitude (optional)</li>
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {selectedZone && currentView === 'mailList' && (
                                <div className="h-full overflow-y-auto bg-gray-50 p-6">
                                    <div className="max-w-6xl mx-auto">
                                        <h2 className="text-2xl font-bold mb-4 text-gray-800">📋 Mail Classification List</h2>
                                        
                                        <div className="bg-white rounded-lg shadow-lg overflow-hidden">
                                            <table className="w-full">
                                                <thead className="bg-gradient-to-r from-blue-600 to-indigo-600 text-white">
                                                    <tr>
                                                        <th className="px-4 py-3 text-left">#</th>
                                                        <th className="px-4 py-3 text-left">Address</th>
                                                        <th className="px-4 py-3 text-left">Mail Type</th>
                                                        <th className="px-4 py-3 text-center">Priority</th>
                                                       
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {deliveries.map((delivery, idx) => (
                                                        <tr key={delivery.id} className={`border-b hover:bg-gray-50 ${idx % 2 === 0 ? 'bg-white' : 'bg-gray-50'}`}>
                                                            <td className="px-4 py-3 font-semibold text-gray-600">
                                                                {idx + 1}
                                                            </td>
                                                            <td className="px-4 py-3">
                                                                <div className="text-sm font-medium text-gray-800">
                                                                    {delivery.address}
                                                                </div>
                                                                <div className="text-xs text-gray-500">
                                                                    {delivery.latitude.toFixed(4)}, {delivery.longitude.toFixed(4)}
                                                                </div>
                                                            </td>
                                                            <td className="px-4 py-3">
                                                                <span className="text-sm font-medium text-gray-700">
                                                                    {delivery.mail_type}
                                                                </span>
                                                            </td>
                                                            <td className="px-4 py-3 text-center">
                                                                <span className={`inline-block px-3 py-1 rounded-full text-xs font-bold ${
                                                                    delivery.priority === 'urgent' 
                                                                        ? 'bg-red-100 text-red-700 border border-red-300' 
                                                                        : 'bg-blue-100 text-blue-700 border border-blue-300'
                                                                }`}>
                                                                    {delivery.priority === 'urgent' ? '🔴 URGENT' : '🔵 REGULAR'}
                                                                </span>
                                                            </td>
                                                           
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>

                                        <div className="mt-6 bg-white p-4 rounded-lg shadow flex justify-between items-center">
                                            <div className="text-sm text-gray-600">
                                                Showing <strong>{deliveries.length}</strong> deliveries
                                                ({urgentCount} urgent, {regularCount} regular)
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {selectedZone && currentView === 'routes' && allRoutes && (
                                <MapView 
                                    deliveries={deliveries}
                                    route={null}
                                    center={center}
                                    showRoute={false}
                                    comparisonMode={true}
                                    baselineRoute={allRoutes.results.nearest_neighbor.deliveries.slice(1)}
                                    optimalRoute={allRoutes.results[allRoutes.best_method].deliveries.slice(1)}
                                    showLabels={false}
                                />
                            )}

                            {selectedZone && currentView === 'comparison' && comparisonRoutes && (
                                <div className="h-full flex">
                                    <div className="flex-1 border-r">
                                        <div className="bg-blue-600 text-white p-2 text-center font-bold">
                                            Original: {getTrafficIcon(trafficLevel)} {trafficLevel} / {getWeatherIcon(weatherCondition)} {weatherCondition}
                                        </div>
                                        <div className="h-[calc(100%-40px)]">
                                            <MapView 
                                                deliveries={deliveries}
                                                route={allRoutes.results[allRoutes.best_method].deliveries.slice(1)}
                                                center={center}
                                                showRoute={true}
                                                comparisonMode={false}
                                                showLabels={false}
                                            />
                                        </div>
                                    </div>
                                    <div className="flex-1">
                                        <div className="bg-red-600 text-white p-2 text-center font-bold">
                                            New: {getTrafficIcon(compareTraffic)} {compareTraffic} / {getWeatherIcon(compareWeather)} {compareWeather}
                                        </div>
                                        <div className="h-[calc(100%-40px)]">
                                            <MapView 
                                                deliveries={deliveries}
                                                route={comparisonRoutes.results[comparisonRoutes.best_method].deliveries.slice(1)}
                                                center={center}
                                                showRoute={true}
                                                comparisonMode={false}
                                                showLabels={false}
                                            />
                                        </div>
                                    </div>
                                </div>
                            )}

                            {selectedZone && currentView === 'relocation' && relocationRoutes && relocationData && (
                                <MapView 
                                    deliveries={deliveries}
                                    route={null}
                                    center={center}
                                    showRoute={false}
                                    comparisonMode={false}
                                    relocationMode={true}
                                    relocationData={relocationData}
                                    baselineRoute={relocationRoutes.original.results[relocationRoutes.original.best_method].deliveries.slice(1)}
                                    optimalRoute={relocationRoutes.new.results[relocationRoutes.new.best_method].deliveries.slice(1)}
                                    afterDeliveries={relocationRoutes.updatedDeliveries}
                                    showLabels={false}
                                />
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
